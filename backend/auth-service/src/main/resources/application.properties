spring.application.name=auth-service

server.port=${SERVER_PORT:8081}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/psyconnect_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:myVerySecretKeyForPsyConnectApplicationJWT2026SecurityKey}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Compte ADMIN par défaut, créé automatiquement au démarrage s'il n'existe
# pas déjà (l'inscription publique en tant qu'ADMIN est bloquée par design).
admin.email=${ADMIN_EMAIL:admin@psyconnect.sn}
admin.password=${ADMIN_PASSWORD:Admin@2026}
admin.pseudo=${ADMIN_PSEUDO:admin}
admin.first-name=${ADMIN_FIRST_NAME:Super}
admin.last-name=${ADMIN_LAST_NAME:Admin}

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
