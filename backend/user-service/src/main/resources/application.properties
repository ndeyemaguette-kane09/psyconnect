spring.application.name=user-service
server.port=${SERVER_PORT:8082}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/psyconnect_user}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:myVerySecretKeyForPsyConnectApplicationJWT2026SecurityKey}

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- Notification du psychologue sur decision admin (NotificationClient) ---
services.notification.url=${NOTIFICATION_SERVICE_URL:http://notification-service}

# --- Pseudo patient pour mode anonyme cote psychologue (AuthServiceClient) ---
services.auth.url=${AUTH_SERVICE_URL:http://auth-service}

# --- Verif acces antecedents medicaux : le psy doit avoir suivi le patient (AppointmentClient) ---
services.appointment.url=${APPOINTMENT_SERVICE_URL:http://appointment-service}

# --- Justificatif (diplome/carte professionnelle) psychologue ---
# 5MB etait trop juste : une photo de diplome prise au telephone (ou un PDF
# scanne) depasse facilement cette taille -> upload qui echoue silencieusement
# a l'inscription (cf. licenseUploadWarning cote Flutter, qui avale l'erreur
# exacte). Remonte a 20MB le 2026-06-30.
app.uploads.license-documents-dir=${LICENSE_DOCS_DIR:uploads/license-documents}
# preuves photo/PDF jointes aux signalements (répertoire séparé des justificatifs psy)
app.uploads.report-evidences-dir=${REPORT_EVIDENCES_DIR:uploads/report-evidences}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=300ms
resilience4j.retry.instances.notificationService.enable-randomized-wait=true

resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.notificationService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.notificationService.register-health-indicator=true

resilience4j.retry.instances.authService.max-attempts=2
resilience4j.retry.instances.authService.wait-duration=300ms

resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.authService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.appointmentService.max-attempts=3
resilience4j.retry.instances.appointmentService.wait-duration=300ms
resilience4j.retry.instances.appointmentService.enable-randomized-wait=true

resilience4j.circuitbreaker.instances.appointmentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.appointmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.appointmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.appointmentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.appointmentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.appointmentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.appointmentService.register-health-indicator=true

# --- Diagnostic 403 mode urgence ---
# Affiche role/token/authority a chaque requete dans logs/user-service.log
# A retirer une fois le bug trouve
logging.level.com.example.userservice.security=DEBUG
logging.level.org.springframework.security=WARN
