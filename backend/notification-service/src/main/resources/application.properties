spring.application.name=notification-service

server.port=${SERVER_PORT:8086}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/psyconnect_notification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

services.user.url=${USER_SERVICE_URL:http://user-service}
jwt.secret=${JWT_SECRET:myVerySecretKeyForPsyConnectApplicationJWT2026SecurityKey}

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
