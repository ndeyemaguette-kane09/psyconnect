spring.application.name=video-service

server.port=${SERVER_PORT:8088}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# --- Tracage distribue ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Pas de base de donnees : le signaling est entierement en memoire.
# Les sessions WebSocket sont perdues au redemarrage du service (comportement attendu).
spring.main.allow-bean-definition-overriding=false
