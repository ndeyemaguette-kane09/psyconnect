spring.application.name=payment-service

server.port=${SERVER_PORT:8085}

# Logs détaillés pour diagnostiquer le 403 sur les endpoints psy
logging.level.com.example.paymentservice.security=DEBUG
logging.level.com.example.paymentservice.exception=DEBUG
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/psyconnect_payment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

services.user.url=${USER_SERVICE_URL:http://user-service}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://notification-service}
services.appointment.url=${APPOINTMENT_SERVICE_URL:http://appointment-service}

jwt.secret=${JWT_SECRET:myVerySecretKeyForPsyConnectApplicationJWT2026SecurityKey}

# --- Resilience4j : tolerance aux pannes sur les appels inter-services ---
# userService : WalletClient -> user-service (debit/credit du solde, chemin
#               critique du paiement).
# appointmentService : AppointmentClient -> appointment-service (verif du
#               RDV avant paiement, liste des RDV d'un psy pour son revenu).
# notificationService : NotificationClient -> notification-service (best
#               effort, jamais bloquant pour le paiement lui-meme).

resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=300ms
resilience4j.retry.instances.userService.enable-randomized-wait=true
resilience4j.retry.instances.userService.ignore-exceptions=com.example.paymentservice.exception.ResourceNotFoundException,com.example.paymentservice.exception.ForbiddenOperationException,com.example.paymentservice.exception.InsufficientBalanceException

resilience4j.retry.instances.appointmentService.max-attempts=3
resilience4j.retry.instances.appointmentService.wait-duration=300ms
resilience4j.retry.instances.appointmentService.enable-randomized-wait=true
resilience4j.retry.instances.appointmentService.ignore-exceptions=com.example.paymentservice.exception.ResourceNotFoundException,com.example.paymentservice.exception.ForbiddenOperationException

resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=300ms
resilience4j.retry.instances.notificationService.enable-randomized-wait=true

resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.userService.ignore-exceptions=com.example.paymentservice.exception.ResourceNotFoundException,com.example.paymentservice.exception.ForbiddenOperationException,com.example.paymentservice.exception.InsufficientBalanceException
resilience4j.circuitbreaker.instances.userService.register-health-indicator=true

resilience4j.circuitbreaker.instances.appointmentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.appointmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.appointmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.appointmentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.appointmentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.appointmentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.appointmentService.ignore-exceptions=com.example.paymentservice.exception.ResourceNotFoundException,com.example.paymentservice.exception.ForbiddenOperationException
resilience4j.circuitbreaker.instances.appointmentService.register-health-indicator=true

resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.notificationService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.notificationService.register-health-indicator=true

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
