spring.application.name=ai-companion-service

server.port=${SERVER_PORT:8087}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
jwt.secret=${JWT_SECRET:myVerySecretKeyForPsyConnectApplicationJWT2026SecurityKey}

# --- Compagnon IA (Ollama + modele open source Mistral) ---
# Ollama doit tourner en local (ou sur une machine accessible) AVANT de
# lancer ce service : `ollama serve` puis `ollama pull mistral`.
# Aucune cle API, aucun appel a un service tiers : tout reste dans
# l'infrastructure du projet (condition de confidentialite des echanges).
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
# qwen2.5:3b choisi plutot que mistral (7B) : sur un Mac M1 8 Go sans GPU
# dedie, mistral genere a ~4 tokens/sec (~3 min de reponse) -> timeout cote
# app. qwen2.5:3b est nettement plus rapide et reste bon en francais.
# Necessite `ollama pull qwen2.5:3b` en local avant de relancer ce service.
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.options.temperature=0.6
# NEVER : on ne tente pas de tirer le modele automatiquement au demarrage
# (le pull initial d'un modele de plusieurs Go doit etre fait explicitement,
# pas declenche silencieusement par un redemarrage du service).
spring.ai.ollama.init.pull-model-strategy=never

# Ce service ne stocke RIEN : pas de base de donnees, pas de log du contenu
# des conversations (confidentialite des echanges IA <-> utilisateur, voir
# RiskDetectionService et CompanionController pour le detail).
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web.client=INFO

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
# Seules les metadonnees de la requete (timing, statut) sont tracees, jamais
# le corps des messages.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
