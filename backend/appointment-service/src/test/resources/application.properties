spring.datasource.url=jdbc:h2:mem:appointmentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
jwt.secret=testSecretKeyForPsyConnectApplicationJWT2026SecurityKey
services.notification.url=http://notification-service
services.user.url=http://user-service

# Resilience4j : memes instances qu'en production mais avec des delais
# raccourcis, pour que les tests qui declenchent retry/circuit breaker
# restent rapides.
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=10ms
resilience4j.retry.instances.userService.ignore-exceptions=com.example.appointmentservice.exception.ResourceNotFoundException,com.example.appointmentservice.exception.ForbiddenOperationException

resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=10ms

resilience4j.circuitbreaker.instances.userService.sliding-window-size=4
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=200ms
resilience4j.circuitbreaker.instances.userService.ignore-exceptions=com.example.appointmentservice.exception.ResourceNotFoundException,com.example.appointmentservice.exception.ForbiddenOperationException

resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=4
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=200ms
