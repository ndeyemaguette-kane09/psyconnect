spring.application.name=appointment-service

server.port=${SERVER_PORT:8083}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/psyconnect_appointment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

services.notification.url=${NOTIFICATION_SERVICE_URL:http://notification-service}
services.user.url=${USER_SERVICE_URL:http://user-service}

jwt.secret=${JWT_SECRET:myVerySecretKeyForPsyConnectApplicationJWT2026SecurityKey}

# --- Resilience4j : tolerance aux pannes sur les appels inter-services ---
# userService   : OwnershipResolver -> user-service (appel synchrone bloquant,
#                 sur le chemin critique de quasi toutes les operations).
# notificationService : NotificationClient -> notification-service (appel
#                 "best effort", deja non bloquant pour l'operation metier ;
#                 retry/circuit breaker evitent surtout de marteler un service
#                 deja en difficulte).

# Retry : 3 tentatives, attente courte entre chaque, avec un peu de hasard
# (randomized) pour eviter que toutes les requetes en parallele ne retentent
# exactement au meme instant ("retry storm").
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=300ms
resilience4j.retry.instances.userService.enable-randomized-wait=true
resilience4j.retry.instances.userService.ignore-exceptions=com.example.appointmentservice.exception.ResourceNotFoundException,com.example.appointmentservice.exception.ForbiddenOperationException,com.example.appointmentservice.exception.InsufficientBalanceException

resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=300ms
resilience4j.retry.instances.notificationService.enable-randomized-wait=true

# Circuit breaker : fenetre glissante de 10 appels, minimum 5 avant de
# calculer un taux d'echec, ouverture au-dela de 50% d'echec, puis 10s avant
# de retenter quelques appels en half-open pour decider de refermer ou non.
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.userService.ignore-exceptions=com.example.appointmentservice.exception.ResourceNotFoundException,com.example.appointmentservice.exception.ForbiddenOperationException,com.example.appointmentservice.exception.InsufficientBalanceException
resilience4j.circuitbreaker.instances.userService.register-health-indicator=true

resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.notificationService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.notificationService.register-health-indicator=true

# Expose /actuator/health avec le detail des circuit breakers (CLOSED /
# OPEN / HALF_OPEN) -- utile pour observer leur etat en demo.
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
# 100% des requetes tracees : acceptable au volume d'une demo/soutenance,
# a reduire (ex: 0.1) si le service tournait en production a forte charge.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
