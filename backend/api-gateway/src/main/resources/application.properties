spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/appointments/**

# Le paiement (simulé) a été fusionné dans appointment-service : il n'y a
# plus de microservice payment-service dédié.
spring.cloud.gateway.routes[3].id=payment-route
spring.cloud.gateway.routes[3].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/payments/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[5].id=psychologist-route
spring.cloud.gateway.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/psychologists/**

spring.cloud.gateway.routes[6].id=patient-route
spring.cloud.gateway.routes[6].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/patients/**

# Le journal privé a été fusionné dans user-service : il n'y a plus de
# microservice journal-service dédié.
spring.cloud.gateway.routes[7].id=journal-route
spring.cloud.gateway.routes[7].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/journal/**

# La simulation de session (vidéo) a été implémentée directement dans
# appointment-service : il n'y a pas de microservice session-service dédié.
spring.cloud.gateway.routes[8].id=session-route
spring.cloud.gateway.routes[8].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/sessions/**

# Service ML (Python/FastAPI) : pas enregistré dans Eureka (pas de client
# Eureka côté Python), donc route fixe vers une URL directe plutôt que
# lb://ML-SERVICE. ML_SERVICE_URL doit pointer vers l'instance uvicorn
# (ex: http://localhost:8000 en local).
spring.cloud.gateway.routes[9].id=ml-service
spring.cloud.gateway.routes[9].uri=${ML_SERVICE_URL:http://localhost:8000}
spring.cloud.gateway.routes[9].predicates[0]=Path=/recommendations/**

# Administration (réservé ROLE_ADMIN, sécurisé au niveau de chaque service
# via SecurityConfig : /admin/** exige hasRole("ADMIN")). Chaque service
# expose son propre /admin/stats/* (renommé en .../accounts, .../profiles,
# .../appointments) pour éviter toute collision de chemin entre ces 3 routes.
spring.cloud.gateway.routes[10].id=admin-auth-route
spring.cloud.gateway.routes[10].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/admin/users/**,/admin/stats/accounts

spring.cloud.gateway.routes[11].id=admin-user-route
spring.cloud.gateway.routes[11].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/admin/psychologists/**,/admin/patients/**,/admin/stats/profiles

spring.cloud.gateway.routes[12].id=admin-appointment-route
spring.cloud.gateway.routes[12].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/admin/appointments/**,/admin/payments/**,/admin/stats/appointments,/admin/platform-settings,/admin/platform-settings/**

# Messagerie patient/psychologue : implémentée directement dans
# appointment-service (mêmes raisons que session-route/payment-route, pas de
# microservice messaging-service dédié) ; chaque conversation reste limitée
# aux deux profils ayant déjà un rendez-vous en commun (cf. MessagingService).
spring.cloud.gateway.routes[13].id=messaging-route
spring.cloud.gateway.routes[13].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/messages/**

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
# Le Gateway est le point d'entree de toute requete cliente : c'est lui qui
# initie la trace que les services en aval (Auth/User/Appointment/...) vont
# propager et enrichir.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
