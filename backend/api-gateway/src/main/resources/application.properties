spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# defaut Spring (256KB) trop bas pour laisser passer l'upload du justificatif
# psy (photo/PDF de diplome) qui transite par ce gateway avant user-service
spring.codec.max-in-memory-size=20MB

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/appointments/**

# Paiement (simulé) + commission + revenu psy : microservice payment-service
# dédié, avec sa propre base (psyconnect_payment).
spring.cloud.gateway.routes[3].id=payment-route
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/payments/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[5].id=psychologist-route
spring.cloud.gateway.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/psychologists/**

spring.cloud.gateway.routes[6].id=patient-route
spring.cloud.gateway.routes[6].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/patients/**

# Le journal privé a été fusionné dans user-service : il n'y a plus de
# microservice journal-service dédié.
spring.cloud.gateway.routes[7].id=journal-route
spring.cloud.gateway.routes[7].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/journal/**

# Les sessions vidéo (Jitsi) sont gérées par session-service dédié (port 8089).
spring.cloud.gateway.routes[8].id=session-route
spring.cloud.gateway.routes[8].uri=lb://SESSION-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/sessions/**

# Service ML (Python/FastAPI) : pas enregistré dans Eureka (pas de client
# Eureka côté Python), donc route fixe vers une URL directe plutôt que
# lb://ML-SERVICE. ML_SERVICE_URL doit pointer vers l'instance uvicorn
# (ex: http://localhost:8000 en local).
spring.cloud.gateway.routes[9].id=ml-service
spring.cloud.gateway.routes[9].uri=${ML_SERVICE_URL:http://localhost:8000}
spring.cloud.gateway.routes[9].predicates[0]=Path=/recommendations/**

# Administration (réservé ROLE_ADMIN, sécurisé au niveau de chaque service
# via SecurityConfig : /admin/** exige hasRole("ADMIN")). Chaque service
# expose son propre /admin/stats/* (renommé en .../accounts, .../profiles,
# .../appointments) pour éviter toute collision de chemin entre ces 3 routes.
spring.cloud.gateway.routes[10].id=admin-auth-route
spring.cloud.gateway.routes[10].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/admin/users/**,/admin/stats/accounts

spring.cloud.gateway.routes[11].id=admin-user-route
spring.cloud.gateway.routes[11].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/admin/psychologists/**,/admin/patients/**,/admin/stats/profiles

# Signalements psychologues : lecture/traitement admin + pièce jointe -> user-service
spring.cloud.gateway.routes[19].id=admin-reports-route
spring.cloud.gateway.routes[19].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[19].predicates[0]=Path=/admin/reports/**

# Broadcast admin (annonces vers tous/patients/psys) : géré par user-service
# (qui a accès aux profils) et non par notification-service directement.
# DOIT être déclaré avant la route générique /notifications/** (route[4])
# pour éviter toute ambiguïté de matching côté gateway.
spring.cloud.gateway.routes[20].id=admin-notifications-route
spring.cloud.gateway.routes[20].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[20].predicates[0]=Path=/admin/notifications/**

spring.cloud.gateway.routes[12].id=admin-appointment-route
spring.cloud.gateway.routes[12].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/admin/appointments/**,/admin/stats/appointments

# paiements/commission/stats paiement -> payment-service, séparé des RDV
# ci-dessus pour éviter toute collision de chemin
spring.cloud.gateway.routes[15].id=admin-payment-route
spring.cloud.gateway.routes[15].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[15].predicates[0]=Path=/admin/payments/**,/admin/stats/payments,/admin/platform-settings,/admin/platform-settings/**

# Messagerie patient/psychologue : implémentée directement dans
# appointment-service (mêmes raisons que session-route/payment-route, pas de
# microservice messaging-service dédié) ; chaque conversation reste limitée
# aux deux profils ayant déjà un rendez-vous en commun (cf. MessagingService).
spring.cloud.gateway.routes[13].id=messaging-route
spring.cloud.gateway.routes[13].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/messages/**

# Compagnon IA de preparation (avant premiere consultation). Service Java
# Spring Boot a part (ai-companion-service), enregistre dans Eureka comme
# les autres, donc lb:// comme d'habitude (contrairement a ml-service qui
# est en Python hors Eureka). Pas de persistance dans ce service : les
# echanges sont confidentiels et ne sont jamais stockes (cf.
# CompanionController).
spring.cloud.gateway.routes[14].id=ai-companion-route
spring.cloud.gateway.routes[14].uri=lb://AI-COMPANION-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/companion/**

# Notes cliniques privees du psychologue (creation/liste sous /patients/**,
# deja route via patient-route) ; edition/suppression par id passent par un
# chemin racine /clinical-notes/** qui necessite sa propre route
spring.cloud.gateway.routes[16].id=clinical-note-route
spring.cloud.gateway.routes[16].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[16].predicates[0]=Path=/clinical-notes/**

# Recommandations post-seance du psy, CRUD dans appointment-service.
# NB : /recommendations/** est reserve au ml-service Python (route [9]) ;
# on utilise /session-recommendations/** pour eviter le conflit.
spring.cloud.gateway.routes[17].id=session-recommendations-route
spring.cloud.gateway.routes[17].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[17].predicates[0]=Path=/session-recommendations/**

# Questionnaires PHQ-9/GAD-7 (appointment-service)
spring.cloud.gateway.routes[18].id=questionnaires-route
spring.cloud.gateway.routes[18].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[18].predicates[0]=Path=/questionnaires/**

# Annonces admin (broadcasts stockés en base dans user-service, lisibles par
# tout utilisateur authentifié via GET /broadcasts — le service filtre par rôle)
spring.cloud.gateway.routes[21].id=broadcasts-route
spring.cloud.gateway.routes[21].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[21].predicates[0]=Path=/broadcasts,/broadcasts/**

# --- Tracage distribue (Micrometer Tracing + Zipkin) ---
# Le Gateway est le point d'entree de toute requete cliente : c'est lui qui
# initie la trace que les services en aval (Auth/User/Appointment/...) vont
# propager et enrichir.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
