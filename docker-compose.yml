# Lance uniquement le collecteur de traces distribuées (Zipkin).
#
# Les 6 services Spring Boot (api-gateway, auth-service, user-service,
# appointment-service, notification-service, eureka-server) sont configurés
# pour exporter leurs spans vers http://localhost:9411/api/v2/spans
# (voir management.zipkin.tracing.endpoint dans chaque application.properties).
# PostgreSQL et les services applicatifs eux-mêmes restent lancés comme
# avant (gradlew bootRun / IDE) : ce compose ne couvre que Zipkin.
#
# Démarrage : docker compose up -d
# UI Zipkin : http://localhost:9411
services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: psyconnect-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
