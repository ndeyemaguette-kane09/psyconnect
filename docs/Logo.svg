<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB39A"/>
      <stop offset="100%" style="stop-color:#0D7B6E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C060"/>
      <stop offset="100%" style="stop-color:#D4A853"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D7B6E;stop-opacity:0.3"/>
      <stop offset="40%" style="stop-color:#0D7B6E;stop-opacity:1"/>
      <stop offset="65%" style="stop-color:#D4A853;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4A853;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D7B6E;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#D4A853;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cercle de fond subtil derrière l'icône -->
  <circle cx="76" cy="80" r="58" fill="url(#circleGrad)"/>
  <circle cx="76" cy="80" r="56" fill="none" stroke="#0D7B6E" stroke-width="0.6" opacity="0.25"/>

  <!-- ════ ONDE PULSÉE MENTALE ════ -->
  <!-- Ligne de base gauche (teal) -->
  <line x1="18" y1="80" x2="34" y2="80" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Petite pré-onde -->
  <polyline points="34,80 38,80 40,72 42,80" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Onde principale — pic cardiaque mental -->
  <polyline
    points="42,80 46,80 50,95 54,48 58,112 62,58 66,80 70,80"
    fill="none"
    stroke="url(#waveGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Point doré brillant au sommet du pic -->
  <circle cx="54" cy="48" r="4.5" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="54" cy="48" r="2" fill="white" opacity="0.85"/>

  <!-- Petite post-onde -->
  <polyline points="70,80 74,80 76,74 78,80 82,80" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Ligne de base droite (teal) -->
  <line x1="82" y1="80" x2="134" y2="80" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Petits points décoratifs (neurones) -->
  <circle cx="22" cy="80" r="3" fill="#0D7B6E" opacity="0.5"/>
  <circle cx="130" cy="80" r="3" fill="#0D7B6E" opacity="0.5"/>

  <!-- Cerveau stylisé minimaliste au-dessus de l'onde -->
  <g transform="translate(50, 20)" opacity="0.18">
    <path d="M13,0 C8,0 4,3 3,7 C1,8 0,10 0,12 C0,15 2,17 4,18 C4,21 6,23 9,23 C9,24 10,25 11,25 L15,25 C16,25 17,24 17,23 C20,23 22,21 22,18 C24,17 26,15 26,12 C26,10 25,8 23,7 C22,3 18,0 13,0 Z" fill="#0D7B6E"/>
  </g>

  <!-- Ligne horizontale décorative sous l'onde -->
  <line x1="18" y1="118" x2="134" y2="118" stroke="url(#waveGrad)" stroke-width="0.8" opacity="0.4"/>

  <!-- ════ TEXTE ════ -->

  <!-- PsyConnect -->
  <text x="152" y="86"
    font-family="Georgia, 'Playfair Display', serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1"
    fill="#0D7B6E">Psy<tspan fill="url(#goldGrad)">Connect</tspan>
  </text>

  <!-- Séparateur doré -->
  <line x1="152" y1="96" x2="400" y2="96" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- SÉNÉGAL -->
  <text x="154" y="114"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="6"
    fill="#0D7B6E"
    opacity="0.75">SÉNÉGAL</text>

  <!-- Slogan -->
  <text x="154" y="135"
    font-family="Arial, sans-serif"
    font-size="10"
    font-style="italic"
    letter-spacing="0.3"
    fill="#7A7A8C"
    opacity="0.9">Prenez soin de vous, en toute confiance.</text>

</svg>
